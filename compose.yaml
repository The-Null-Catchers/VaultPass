name: vaultpass
x-api: &api
  build: ./backend
  env_file: .env
  restart: unless-stopped
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set database password}
      POSTGRES_DB: ${POSTGRES_DB:-vaultpass}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    <<: *api
    restart: 'no'
    command: [alembic, upgrade, head]
  api:
    <<: *api
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  worker:
    <<: *api
    command: [celery, -A, app.tasks.celery, worker, --loglevel=warning]
  scheduler:
    <<: *api
    command: [celery, -A, app.tasks.celery, beat, --loglevel=warning, --schedule=/tmp/celerybeat-schedule]
  web:
    build:
      context: ./web
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ['127.0.0.1:3000:3000']
    depends_on: [api]
  mailpit:
    image: axllent/mailpit:v1.29
    ports: ['127.0.0.1:8025:8025']
volumes:
  postgres:
  redis:
