name: VaultPass CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vaultpass
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: vaultpass
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vaultpass"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock && pip install -e '.[dev]'
      - run: ruff check app tests && ruff format --check app tests && mypy app
      - run: pytest -q
      - name: PostgreSQL migration validation
        env:
          DATABASE_URL: postgresql+psycopg://vaultpass:ci-test-only@localhost:5432/vaultpass
        run: alembic upgrade head && alembic check && alembic downgrade base && alembic upgrade head
      - run: pip-audit -r requirements.lock
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run build
      - run: npm audit --omit=dev
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze && flutter test
      - name: Build test APK and unsigned release AAB
        env:
          API_URL: ${{ vars.VAULTPASS_API_URL || 'https://vaultpass.example.invalid' }}
        run: |
          flutter build apk --debug --dart-define=API_URL="$API_URL"
          flutter build appbundle --release --dart-define=API_URL="$API_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: VaultPass-Android-test-builds
          path: |
            mobile/build/app/outputs/flutter-apk/app-debug.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet && docker compose build
      - run: docker compose up -d
      - name: Clean installation smoke check
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health; then exit 0; fi
            sleep 3
          done
          exit 1
      - if: always()
        run: docker compose down -v
