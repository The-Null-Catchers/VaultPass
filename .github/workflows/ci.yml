name: VaultPass CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repair-web-rotation:
    if: github.event_name == 'pull_request' && github.head_ref == 'security/web-personal-vault-key-rotation-20261006'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Wire personal vault rotation into the web vault
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("web/src/app/page.tsx")
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              'import { api, clearTokens, setTokens } from "../lib/api";\n',
              'import { api, clearTokens, setTokens } from "../lib/api";\n'
              'import { rotatePersonalVault } from "../lib/personalRotation";\n',
          )
          replace_once(
              '  const accountKey = useRef<Uint8Array | null>(null),\n'
              '    vaultKey = useRef<Uint8Array | null>(null),\n'
              '    vaultId = useRef("");\n',
              '  const accountKey = useRef<Uint8Array | null>(null),\n'
              '    vaultKey = useRef<Uint8Array | null>(null),\n'
              '    vaultId = useRef(""),\n'
              '    vaultKeyVersion = useRef(1);\n'
              '  const [vaultKeyEpoch, setVaultKeyEpoch] = useState(1);\n',
          )
          replace_once(
              '      const page = await api<{\n'
              '        cursor: number;\n'
              '        has_more: boolean;\n'
              '        items: Row[];\n'
              '      }>(`/vaults/${vaultId.current}/sync?after=${cursor}`);\n'
              '      cursor = page.cursor;\n',
              '      const page = await api<{\n'
              '        cursor: number;\n'
              '        has_more: boolean;\n'
              '        key_version: number;\n'
              '        items: Row[];\n'
              '      }>(`/vaults/${vaultId.current}/sync?after=${cursor}`);\n'
              '      if (page.key_version !== vaultKeyVersion.current)\n'
              '        throw new Error("Vault encryption key changed. Lock and unlock again to load the current key.");\n'
              '      cursor = page.cursor;\n',
          )
          replace_once(
              '      const vaults = await api<{ id: string; wrapped_key: Envelope }[]>("/vaults");\n'
              '      if (!vaults.length) throw new Error("Account has no vault");\n'
              '      vaultId.current = vaults[0].id;\n'
              '      vaultKey.current = await open(accountKey.current, vaults[0].wrapped_key, context("vault", result.user_id, vaultId.current));\n',
              '      const vaults = await api<{ id: string; wrapped_key: Envelope; key_version: number }[]>("/vaults");\n'
              '      if (!vaults.length) throw new Error("Account has no vault");\n'
              '      vaultId.current = vaults[0].id;\n'
              '      vaultKeyVersion.current = vaults[0].key_version;\n'
              '      setVaultKeyEpoch(vaults[0].key_version);\n'
              '      vaultKey.current = await open(accountKey.current, vaults[0].wrapped_key, context("vault", result.user_id, vaultId.current));\n',
          )
          replace_once(
              '    await api(`/vaults/${vaultId.current}/items/${id}`, "PUT", {\n'
              '      expected_version: version,\n'
              '      payload,\n',
              '    await api(`/vaults/${vaultId.current}/items/${id}`, "PUT", {\n'
              '      expected_version: version,\n'
              '      expected_key_version: vaultKeyVersion.current,\n'
              '      payload,\n',
          )
          replace_once(
              '                                await api(`/vaults/${vaultId.current}/items/${selectedItem.id}?expected_version=${selectedItem.version}`, "DELETE");\n',
              '                                await api(`/vaults/${vaultId.current}/items/${selectedItem.id}?expected_version=${selectedItem.version}&expected_key_version=${vaultKeyVersion.current}`, "DELETE");\n',
          )
          replace_once(
              '  const navigate = (name: string) => {\n',
              '  const rotateVaultEncryptionKey = () => {\n'
              '    if (!window.confirm("Rotate the personal vault encryption key now? All retained items will be re-encrypted locally before an atomic server cutover.")) return;\n'
              '    void run(async () => {\n'
              '      if (!session || !accountKey.current || !vaultKey.current || !vaultId.current)\n'
              '        throw new Error("Unlock the vault before rotating its encryption key");\n'
              '      const currentEntries = await sync();\n'
              '      const previousKey = vaultKey.current;\n'
              '      const rotated = await rotatePersonalVault({\n'
              '        userId: session.user_id,\n'
              '        vaultId: vaultId.current,\n'
              '        currentKeyVersion: vaultKeyVersion.current,\n'
              '        accountKey: accountKey.current,\n'
              '        entries: currentEntries.map((entry) => ({\n'
              '          id: entry.id,\n'
              '          version: entry.version,\n'
              '          deleted: entry.deleted,\n'
              '          data: entry.data,\n'
              '        })),\n'
              '      });\n'
              '      vaultKey.current = rotated.vaultKey;\n'
              '      vaultKeyVersion.current = rotated.keyVersion;\n'
              '      setVaultKeyEpoch(rotated.keyVersion);\n'
              '      previousKey.fill(0);\n'
              '      try {\n'
              '        await sync();\n'
              '      } catch (syncError) {\n'
              '        lock();\n'
              '        throw syncError;\n'
              '      }\n'
              '      notify(`Personal vault encryption key rotated to epoch ${rotated.keyVersion}`);\n'
              '    });\n'
              '  };\n'
              '  const navigate = (name: string) => {\n',
          )
          replace_once(
              '                  Sign out\n'
              '                </button>\n'
              '              </section>\n'
              '              <section className="panel">\n'
              '                <h2>Recovery key</h2>\n',
              '                  Sign out\n'
              '                </button>\n'
              '              </section>\n'
              '              <section className="panel">\n'
              '                <h2>Vault encryption key</h2>\n'
              '                <p>\n'
              '                  Current key epoch: <strong>{vaultKeyEpoch}</strong>. Rotation generates a fresh 256-bit key in this browser and re-encrypts every retained vault item locally.\n'
              '                </p>\n'
              '                <button disabled={busy} onClick={rotateVaultEncryptionKey}>\n'
              '                  <RefreshCw size={16} />\n'
              '                  Rotate vault encryption key\n'
              '                </button>\n'
              '                <p className="warning">Keep this tab open until rotation finishes. Plaintext keys and item contents never leave this device.</p>\n'
              '              </section>\n'
              '              <section className="panel">\n'
              '                <h2>Recovery key</h2>\n',
          )

          path.write_text(text)
          PY
      - name: Validate web rotation changes
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
      - name: Restore normal CI workflow and push implementation
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/app/page.tsx .github/workflows/ci.yml
          git commit -m "web: wire personal vault key rotation into vault UI"
          git push origin HEAD:${{ github.head_ref }}
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vaultpass
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: vaultpass
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vaultpass"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock && pip install -e '.[dev]'
      - run: ruff check app tests && ruff format --check app tests && mypy app
      - run: pytest -q
      - name: PostgreSQL migration validation
        env:
          DATABASE_URL: postgresql+psycopg://vaultpass:ci-test-only@localhost:5432/vaultpass
        run: alembic upgrade head && alembic check && alembic downgrade base && alembic upgrade head
      - run: pip-audit -r requirements.lock
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r ../backend/requirements.lock
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser E2E
        run: npm run e2e
      - run: npm audit --omit=dev
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze && flutter test
      - name: Build test APK and unsigned release AAB
        env:
          API_URL: ${{ vars.VAULTPASS_API_URL || 'https://vaultpass.example.invalid' }}
        run: |
          flutter build apk --debug --dart-define=API_URL="$API_URL"
          flutter build appbundle --release --dart-define=API_URL="$API_URL"
      - uses: actions/upload-artifact@v7
        with:
          name: VaultPass-Android-test-builds
          path: |
            mobile/build/app/outputs/flutter-apk/app-debug.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Nginx edge configuration
        run: |
          cat > /tmp/vaultpass-nginx.conf <<'EOF'
          events {}
          http {
            include /etc/nginx/vaultpass/nginx-rate-limit-zones.conf;
            server {
              listen 8080;
              include /etc/nginx/vaultpass/nginx.conf;
            }
          }
          EOF
          docker run --rm \
            -v "$PWD/deploy:/etc/nginx/vaultpass:ro" \
            -v /tmp/vaultpass-nginx.conf:/etc/nginx/nginx.conf:ro \
            nginx:1.26-alpine nginx -t
      - run: cp .env.example .env
      - run: docker compose config --quiet && docker compose build
      - run: docker compose up -d
      - name: Clean installation smoke check
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health; then exit 0; fi
            sleep 3
          done
          exit 1
      - if: always()
        run: docker compose down -v
