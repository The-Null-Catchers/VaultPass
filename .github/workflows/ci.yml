name: VaultPass CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repair-pr:
    if: github.event_name == 'pull_request' && github.head_ref == 'security/personal-vault-key-rotation-api-20261006'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply deterministic CI fixes
        run: |
          python -m pip install ruff==0.16.8
          ruff format backend/app/main.py backend/tests/test_personal_rotation.py
          cd web
          npm audit fix --package-lock-only --omit=dev
          cd ..
      - name: Restore normal CI workflow and push fixes
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          if git diff --quiet; then
            echo "No repair changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/main.py backend/tests/test_personal_rotation.py web/package-lock.json .github/workflows/ci.yml
          git commit -m "ci: apply formatter and dependency audit fixes"
          git push origin HEAD:${{ github.head_ref }}
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vaultpass
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: vaultpass
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vaultpass"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock && pip install -e '.[dev]'
      - run: ruff check app tests && ruff format --check app tests && mypy app
      - run: pytest -q
      - name: PostgreSQL migration validation
        env:
          DATABASE_URL: postgresql+psycopg://vaultpass:ci-test-only@localhost:5432/vaultpass
        run: alembic upgrade head && alembic check && alembic downgrade base && alembic upgrade head
      - run: pip-audit -r requirements.lock
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r ../backend/requirements.lock
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser E2E
        run: npm run e2e
      - run: npm audit --omit=dev
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze && flutter test
      - name: Build test APK and unsigned release AAB
        env:
          API_URL: ${{ vars.VAULTPASS_API_URL || 'https://vaultpass.example.invalid' }}
        run: |
          flutter build apk --debug --dart-define=API_URL="$API_URL"
          flutter build appbundle --release --dart-define=API_URL="$API_URL"
      - uses: actions/upload-artifact@v7
        with:
          name: VaultPass-Android-test-builds
          path: |
            mobile/build/app/outputs/flutter-apk/app-debug.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Nginx edge configuration
        run: |
          cat > /tmp/vaultpass-nginx.conf <<'EOF'
          events {}
          http {
            include /etc/nginx/vaultpass/nginx-rate-limit-zones.conf;
            server {
              listen 8080;
              include /etc/nginx/vaultpass/nginx.conf;
            }
          }
          EOF
          docker run --rm \
            -v "$PWD/deploy:/etc/nginx/vaultpass:ro" \
            -v /tmp/vaultpass-nginx.conf:/etc/nginx/nginx.conf:ro \
            nginx:1.26-alpine nginx -t
      - run: cp .env.example .env
      - run: docker compose config --quiet && docker compose build
      - run: docker compose up -d
      - name: Clean installation smoke check
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health; then exit 0; fi
            sleep 3
          done
          exit 1
      - if: always()
        run: docker compose down -v
