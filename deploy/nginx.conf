# Include in a TLS server {} block. Use a valid certificate managed by your platform.
# Also include deploy/nginx-rate-limit-zones.conf once from the nginx http {} scope.
client_max_body_size 400k;
client_body_timeout 10s;
client_header_timeout 10s;
keepalive_timeout 30s;
send_timeout 30s;
limit_req_status 429;
limit_conn_status 429;

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;

# API traffic is bounded at the trusted edge before it reaches Next.js/FastAPI.
# The backend still enforces its own peer/account throttles and request-size limits.
location /api/ {
    limit_req zone=vaultpass_api burst=20 nodelay;
    limit_conn vaultpass_conn 20;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
}

location / {
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
}
# Never expose Redis, PostgreSQL or SMTP publicly.
